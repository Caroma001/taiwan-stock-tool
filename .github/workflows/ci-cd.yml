name: twstock M8.8.2 Manual Release Verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: twstock-m8-8-2-manual-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  verify-build:
    name: Manual Verify and Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run safety:check
      - run: npm run ci-check
      - run: npm run typecheck
      - run: npm run build
