name: Production Health Manual Only

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manual-health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APP_URL: ${{ secrets.TWSTOCK_PRODUCTION_URL }}
    steps:
      - name: Manual read-only health check
        shell: bash
        run: |
          test -n "${APP_URL:-}" || { echo "Missing TWSTOCK_PRODUCTION_URL"; exit 1; }
          curl --fail-with-body --location --max-time 30 --retry 2 "${APP_URL%/}/api/health"
          echo "Read-only health check completed. No rollback or deployment action was performed."
