name: Cloud Scheduler Continuation
on:
  schedule:
    - cron: "*/20 10-15 * * 1-5"
  workflow_dispatch:
jobs:
  continue-cloud-job:
    runs-on: ubuntu-latest
    steps:
      - name: Continue twstock cloud scheduler
        env:
          APP_URL: ${{ secrets.TWSTOCK_PRODUCTION_URL }}
          ADMIN_SECRET: ${{ secrets.CLOUD_ADMIN_SECRET }}
        run: |
          test -n "$APP_URL" || (echo "Missing TWSTOCK_PRODUCTION_URL" && exit 1)
          test -n "$ADMIN_SECRET" || (echo "Missing CLOUD_ADMIN_SECRET" && exit 1)
          curl --fail-with-body --retry 2 --max-time 290 \
            -X POST "$APP_URL/api/cloud/worker" \
            -H "Content-Type: application/json" \
            -H "x-cloud-admin-secret: $ADMIN_SECRET" \
            --data '{"source":"github-actions","maxDurationMs":265000,"batchSize":12}'
